version: 2.1

jobs:
  build_test:
    docker: 
      - image: circleci/node:12
    steps:
      - checkout
      - run:
          name: Install npm dependencies
          command: |
            npm install --save

  build_docker_image:
    docker:
      - image: circleci/node:12
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_catching: false
      - run:
          name: Build Docker image
          command: |
            docker build -t ebotsidneysmith/nodejswebapp:latest .
      - run:
          name: Push application Docker image
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u ebotsidneysmith --password-stdin
            docker push ebotsidneysmith/nodejswebapp:latest


workflows:
  build_test:
    jobs:
      - build_test
      - build_docker_image
